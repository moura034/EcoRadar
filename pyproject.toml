[project]
name = "ecoradar"
version = "1.0.0"
description = "Plataforma inteligente de monitoramento e estimativa de riscos ambientais no Piauí"
requires-python = ">=3.11,<3.15"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
